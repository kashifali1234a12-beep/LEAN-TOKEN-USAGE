 stroke-opacity="0.03"/><line x1="0" y1="320" x2="1200" y2="320" stroke="#ffffff" stroke-opacity="0.03"/><line x1="0" y1="352" x2="1200" y2="352" stroke="#ffffff" stroke-opacity="0.03"/><line x1="0" y1="384" x2="1200" y2="384" stroke="#ffffff" stroke-opacity="0.03"/><line x1="0" y1="416" x2="1200" y2="416" stroke="#ffffff" stroke-opacity="0.03"/><line x1="0" y1="448" x2="1200" y2="448" stroke="#ffffff" stroke-opacity="0.03"/><line x1="0" y1="480" x2="1200" y2="480" stroke="#ffffff" stroke-opacity="0.03"/><line x1="0" y1="512" x2="1200" y2="512" stroke="#ffffff" stroke-opacity="0.03"/><rect x="1" y="1" width="1198" height="538" rx="24" fill="none" stroke="#6366f1" stroke-opacity="0.35"/><text x="600" y="70" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="32" fill="#f9fafb" font-weight="800" text-anchor="middle" >6 lessons behind the −86%</text><text x="600" y="104" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8" font-weight="500" text-anchor="middle" >Quality never traded: same model, same effort, same reviews and tests.</text><rect x="66" y="148" width="340" height="160" rx="22" fill="#000" opacity="0.4" filter="url(#soft)"/><rect x="60" y="140" width="340" height="160" rx="22" fill="#111827" stroke="#3b82f6" stroke-opacity="0.6"/><rect x="60" y="140" width="340" height="6" rx="3" fill="#3b82f6"/><circle cx="106" cy="196" r="26" fill="url(#side3b82f6)"/><text x="106" y="205" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#fff" font-weight="900" text-anchor="middle" >1</text><text x="148" y="204" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#f9fafb" font-weight="800" text-anchor="start" >Measure first</text><text x="86" y="258" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start" >See per-agent cost before cutting anything.</text><rect x="436" y="148" width="340" height="160" rx="22" fill="#000" opacity="0.4" filter="url(#soft)"/><rect x="430" y="140" width="340" height="160" rx="22" fill="#111827" stroke="#8b5cf6" stroke-opacity="0.6"/><rect x="430" y="140" width="340" height="6" rx="3" fill="#8b5cf6"/><circle cx="476" cy="196" r="26" fill="url(#side8b5cf6)"/><text x="476" y="205" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#fff" font-weight="900" text-anchor="middle" >2</text><text x="518" y="204" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#f9fafb" font-weight="800" text-anchor="start" >Fresh, small agents</text><text x="456" y="258" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start" >One per task; hand off at ~150k context.</text><rect x="806" y="148" width="340" height="160" rx="22" fill="#000" opacity="0.4" filter="url(#soft)"/><rect x="800" y="140" width="340" height="160" rx="22" fill="#111827" stroke="#f43f5e" stroke-opacity="0.6"/><rect x="800" y="140" width="340" height="6" rx="3" fill="#f43f5e"/><circle cx="846" cy="196" r="26" fill="url(#sidef43f5e)"/><text x="846" y="205" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#fff" font-weight="900" text-anchor="middle" >3</text><text x="888" y="204" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#f9fafb" font-weight="800" text-anchor="start" >Never wake a giant</text><text x="826" y="258" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start" >Big idle contexts reload at 2x. Retire them.</text><rect x="66" y="338" width="340" height="160" rx="22" fill="#000" opacity="0.4" filter="url(#soft)"/><rect x="60" y="330" width="340" height="160" rx="22" fill="#111827" stroke="#f59e0b" stroke-opacity="0.6"/><rect x="60" y="330" width="340" height="6" rx="3" fill="#f59e0b"/><circle cx="106" cy="386" r="26" fill="url(#sidef59e0b)"/><text x="106" y="395" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#fff" font-weight="900" text-anchor="middle" >4</text><text x="148" y="394" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#f9fafb" font-weight="800" text-anchor="start" >Wait in one step</text><text x="86" y="448" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start" >No polling, no “still running” wake-ups.</text><rect x="436" y="338" width="340" height="160" rx="22" fill="#000" opacity="0.4" filter="url(#soft)"/><rect x="430" y="330" width="340" height="160" rx="22" fill="#111827" stroke="#10b981" stroke-opacity="0.6"/><rect x="430" y="330" width="340" height="6" rx="3" fill="#10b981"/><circle cx="476" cy="386" r="26" fill="url(#side10b981)"/><text x="476" y="395" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#fff" font-weight="900" text-anchor="middle" >5</text><text x="518" y="394" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#f9fafb" font-weight="800" text-anchor="start" >Paths, not prose</text><text x="456" y="448" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start" >Short reports; pass file paths, not rewrites.</text><rect x="806" y="338" width="340" height="160" rx="22" fill="#000" opacity="0.4" filter="url(#soft)"/><rect x="800" y="330" width="340" height="160" rx="22" fill="#111827" stroke="#ec4899" stroke-opacity="0.6"/><rect x="800" y="330" width="340" height="6" rx="3" fill="#ec4899"/><circle cx="846" cy="386" r="26" fill="url(#sideec4899)"/><text x="846" y="395" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#fff" font-weight="900" text-anchor="middle" >6</text><text x="888" y="394" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#f9fafb" font-weight="800" text-anchor="start" >Fix the class</text><text x="826" y="448" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start" >3 failed rounds? Change the design.</text></svg>