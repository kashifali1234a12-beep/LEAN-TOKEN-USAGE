ue,Helvetica,Arial,sans-serif" font-size="17" fill="#e5e7eb" font-weight="500" text-anchor="start" >Reviewers (fresh each time — already lean)</text><rect x="80" y="306" width="1040" height="58" rx="29" fill="#ffffff" fill-opacity="0.04"/><rect x="80" y="306" width="322.5" height="58" rx="29" fill="url(#side3b82f6)"/><rect x="80" y="306" width="322.5" height="24" rx="12" fill="#fff" fill-opacity="0.18"/><text x="462.5" y="343" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#5ed0ff" font-weight="800" text-anchor="start" >21%</text><text x="542.5" y="343" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" fill="#e5e7eb" font-weight="500" text-anchor="start" >Coordinator re-reading its own context</text><rect x="80" y="384" width="1040" height="58" rx="29" fill="#ffffff" fill-opacity="0.04"/><rect x="80" y="384" width="97.5" height="58" rx="29" fill="url(#sidef59e0b)"/><rect x="80" y="384" width="97.5" height="24" rx="12" fill="#fff" fill-opacity="0.18"/><text x="237.5" y="421" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#fffc11" font-weight="800" text-anchor="start" >3%</text><text x="317.5" y="421" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" fill="#e5e7eb" font-weight="500" text-anchor="start" >Actually running commands and tests</text><rect x="80" y="462" width="1040" height="58" rx="29" fill="#ffffff" fill-opacity="0.04"/><rect x="80" y="462" width="74" height="58" rx="29" fill="url(#side64748b)"/><rect x="80" y="462" width="74" height="24" rx="12" fill="#fff" fill-opacity="0.18"/><text x="214" y="499" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#a0b9de" font-weight="800" text-anchor="start" >1%</text><text x="294" y="499" font-family="Inter,Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" fill="#e5e7eb" font-weight="500" text-anchor